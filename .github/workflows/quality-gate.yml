name: Quality Gate & Auto QA

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-and-tests:
    name: Static L0 QA & Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run syntax & contract gates
        run: |
          node --check scripts/auto-qa-gate.mjs
          node --check scripts/auto-pipeline.mjs
          node --check scripts/pipeline-state.mjs
          node --check scripts/ci-verdict.mjs
          bash -n scripts/git-wt.sh
          bash -n scripts/ego-browser-qa.sh
          bash -n scripts/materialize-with-rollback.sh

      - name: Run diff-aware L0 static QA
        run: |
          mkdir -p .workbuddy/evidence
          node scripts/auto-qa-gate.mjs . --diff --base origin/main --json --output .workbuddy/evidence/auto-qa-report.json

      - name: Run regression tests
        run: |
          node --test scripts/auto-pipeline.test.mjs

      - name: Upload QA evidence
        uses: actions/upload-artifact@v4
        with:
          name: qa-evidence
          path: .workbuddy/evidence/
          retention-days: 7

      - name: Evaluate CI verdict
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          node scripts/ci-verdict.mjs \
            --report .workbuddy/evidence/auto-qa-report.json \
            ${{ github.event.pull_request.number && format('--pr {0}', github.event.pull_request.number) || '--dry-run' }}
