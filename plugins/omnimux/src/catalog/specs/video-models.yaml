  # 快手数字人 Kling Avatar：纯数字人口播；H1 不 listed；不吃粗 videoGenerate
  - id: "kling-avatar"
    label: "Kling Avatar (数字人)"
    family: "kling"
    badge: "数字人"
    subtitle: "音频对口型"
    operations:
      - id: "digital_human"
        label: "数字人口播"
        output:
          type: "video"
        inputs:
          - slot: "avatar_image"
            type: "image"
            role: "reference"
            source: "upstream_edge"
            min: 1
            max: 1
            allowedMimes: ["image/png", "image/jpeg", "image/webp"]
            maxSizeMb: 10
            limitSource:
              kind: "official_docs"
              url: "https://klingai.kuaishou.com/docs/avatar"
            hint: "需清晰单人人像图"
          - slot: "audio_track"
            type: "audio"
            role: "audio_track"
            source: "upstream_edge"
            min: 1
            max: 1
            allowedMimes: ["audio/mp3", "audio/wav", "audio/m4a"]
            maxSizeMb: 25
            maxDurationSec: 60
            limitSource:
              kind: "official_docs"
              url: "https://klingai.kuaishou.com/docs/avatar"
            hint: "音频驱动口型与微表情"
    parameters:
      aspectRatio: ["16:9", "9:16", "1:1"]
      duration: [5, 10]
    research:
      status: "draft"
      docUrl: "https://klingai.kuaishou.com/docs/avatar"
      notes: "H1 quarantine; dedicated videoDigitalHuman profile unavailable; mapper audio is H2"
    execution:
      status: "none"
      profileId: "videoDigitalHuman"
      notes: "H1: unavailable dedicated profile; must not use coarse videoGenerate"

