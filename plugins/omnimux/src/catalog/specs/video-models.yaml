# 视频模型能力契约 (Video Models Capability Contract)
# H2: 15 个 runtime video ID 全处置。
# Batch A：seedance-2-0-fast 仅 text_to_video 有仓内 dated live 证据
# （docs/evidence/2026-08-14-omnimux-video.md）→ verified+live；first_frame/multi_ref draft。
# 冲突限制取更严：seedance 系与 grok video 的 video_multi_ref 一律 max:1 + policy_conservative
# （不承诺 max4/max8，待 dated 复测放宽）。kling-avatar unavailable（mapper 丢 audioTrack）。
# omni_flash / kling-o1 / kling-o3 / kling-v3-motion-control quarantine（无证据，仅占位契约，不上架）。
schemaVersion: "1.1"
managementGroup: "video"
