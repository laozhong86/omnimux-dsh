            maxSizeMb: 10
      - mode: "first_last_frame"
        label: "首尾帧"
        inputs:
          - slot: "first_frame"
            type: "image"
            role: "first_frame"
            min: 1
            max: 1
            allowedMimes: ["image/png", "image/jpeg", "image/webp"]
            maxSizeMb: 10
          - slot: "last_frame"
            type: "image"
            role: "last_frame"
            min: 1
            max: 1
            allowedMimes: ["image/png", "image/jpeg", "image/webp"]
            maxSizeMb: 10
    parameters:
      aspectRatio: ["16:9", "9:16", "1:1"]
      duration: [5, 10]
      resolution: ["1080P"]
    governance:
      docUrl: "https://klingai.kuaishou.com/docs"
      confidence: "verified"

  # 快手数字人 Kling Avatar：纯数字人口播，严禁出现首尾帧或无音频运行
  - id: "kling-avatar"
    label: "Kling Avatar (数字人)"
    family: "kling"
    badge: "数字人"
    subtitle: "音频对口型"
    modes:
      - mode: "digital_human"
        label: "数字人口播"
        inputs:
          - slot: "avatar_image"
            type: "image"
            role: "reference"
            min: 1
            max: 1
            allowedMimes: ["image/png", "image/jpeg", "image/webp"]
            maxSizeMb: 10
            hint: "需清晰单人人像图"
          - slot: "audio_track"
            type: "audio"
            role: "audio_track"
            min: 1
            max: 1
            allowedMimes: ["audio/mp3", "audio/wav", "audio/m4a"]
            maxSizeMb: 25
            maxDurationSec: 60
            hint: "音频驱动口型与微表情"
    parameters:
      aspectRatio: ["16:9", "9:16", "1:1"]
      duration: [5, 10]
    governance:
      docUrl: "https://klingai.kuaishou.com/docs/avatar"
      confidence: "verified"

  # 谷歌 Veo 系列：纯参考模式，无首尾帧
  - id: "veo-3.1"
