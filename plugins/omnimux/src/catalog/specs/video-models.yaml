        inputs:
          - slot: "start_frame"
            type: "image"
            role: "first_frame"
            min: 1
            max: 1
            allowedMimes: ["image/png", "image/jpeg", "image/webp"]
            maxSizeMb: 20
      - mode: "video_multi_ref"
        label: "多图参考"
        inputs:
          - slot: "reference_images"
            type: "image"
            role: "reference"
            min: 1
            max: 4
            allowedMimes: ["image/png", "image/jpeg", "image/webp"]
            maxSizeMb: 20
    parameters:
      aspectRatio: ["16:9", "9:16", "1:1"]
      duration: [5, 10]
      resolution: ["720P", "1080P"]
    governance:
      docUrl: "https://www.volcengine.com/docs/82379/1344485"
      confidence: "verified"

  - id: "seedance-2-0"
    label: "Seedance 2.0"
    family: "bytedance"
    subtitle: "720P · ⏱ 5s"
    modes:
      - mode: "text_to_video"
        label: "文生视频"
        inputs: []
      - mode: "first_frame"
        label: "首帧生视频"
        inputs:
          - slot: "start_frame"
            type: "image"
            role: "first_frame"
            min: 1
            max: 1
            allowedMimes: ["image/png", "image/jpeg", "image/webp"]
            maxSizeMb: 20
    parameters:
      aspectRatio: ["16:9", "9:16", "1:1"]
      duration: [5]
      resolution: ["720P"]
    governance:
      docUrl: "https://www.volcengine.com/docs/82379/1344485"
      confidence: "verified"

  # 快手 Kling 可灵系列：原生支持首尾帧与首帧，不支持自由多图主体参考
  - id: "kling-v3"
    label: "Kling V3"
    family: "kling"
    badge: "可灵 3.0"
    subtitle: "1080P-4K · ⏱ 5-10s · 🔊"
    modes:
      - mode: "text_to_video"
        label: "文生视频"
        inputs: []
      - mode: "first_frame"
        label: "首帧生视频"
        inputs:
          - slot: "first_frame"
            type: "image"
            role: "first_frame"
            min: 1
            max: 1
            allowedMimes: ["image/png", "image/jpeg", "image/webp"]
            maxSizeMb: 10
      - mode: "first_last_frame"
        label: "首尾帧"
        inputs:
          - slot: "first_frame"
            type: "image"
            role: "first_frame"
            min: 1
            max: 1
            allowedMimes: ["image/png", "image/jpeg", "image/webp"]
            maxSizeMb: 10
          - slot: "last_frame"
            type: "image"
            role: "last_frame"
            min: 1
            max: 1
            allowedMimes: ["image/png", "image/jpeg", "image/webp"]
            maxSizeMb: 10
    parameters:
      aspectRatio: ["16:9", "9:16", "1:1"]
      duration: [5, 10]
      resolution: ["1080P", "4K"]
      sound: true
    governance:
      docUrl: "https://klingai.kuaishou.com/docs"
      confidence: "verified"

  - id: "kling-v2-6"
    label: "Kling V2.6"
    family: "kling"
    subtitle: "1080P · ⏱ 5-10s"
    modes:
      - mode: "text_to_video"
        label: "文生视频"
        inputs: []
      - mode: "first_frame"
        label: "首帧生视频"
        inputs:
          - slot: "first_frame"
            type: "image"
            role: "first_frame"
            min: 1
