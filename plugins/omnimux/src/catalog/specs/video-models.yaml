models:
  # 字节跳动 Seedance 系列：支持文生、首帧、多图参考，绝不支持首尾帧过渡
  - id: "seedance-2-0-fast"
    label: "Seedance 2.0 Fast"
    family: "bytedance"
    badge: "默认"
    subtitle: "720P · ⏱ 4-8s"
    operations:
      - id: "text_to_video"
        label: "文生视频"
        output:
          type: "video"
        inputs:
          - slot: "prompt"
            type: "text"
            role: "prompt"
            source: "node_field"
            min: 1
            max: 1
        research:
          status: "verified"
          docUrl: "docs/evidence/2026-08-14-omnimux-video.md"
          verifiedAt: "2026-08-14"
        execution:
          status: "live"
          profileId: "videoGenerate"
          seam: "videoGenerate"
      - id: "first_frame"
        label: "首帧生视频"
        output:
          type: "video"
        inputs:
          - slot: "prompt"
            type: "text"
            role: "prompt"
            source: "node_field"
            min: 1
            max: 1
          - slot: "start_frame"
            type: "image"
            role: "first_frame"
            source: "upstream_edge"
            min: 1
            max: 1
            allowedMimes: ["image/png", "image/jpeg", "image/webp"]
            maxSizeMb: 20
            limitSource:
              kind: "official_docs"
              url: "https://www.volcengine.com/docs/82379/1344485"
        research:
          status: "draft"
        execution:
          status: "stub"
          profileId: "videoGenerate"
          seam: "videoGenerate"
      - id: "video_multi_ref"
        label: "多图参考"
        output:
          type: "video"
        inputs:
          - slot: "prompt"
            type: "text"
            role: "prompt"
            source: "node_field"
            min: 1
            max: 1
          - slot: "reference_images"
            type: "image"
            role: "reference"
            source: "upstream_edge"
            min: 0
            max: 1
            allowedMimes: ["image/png", "image/jpeg", "image/webp"]
            maxSizeMb: 20
            limitSource:
              kind: "policy_conservative"
              note: "runtime 对账取更严：验证完成前单图/首帧，不承诺 max4；待 dated 复测放宽"
        research:
          status: "draft"
        execution:
          status: "stub"
          profileId: "videoGenerate"
          seam: "videoGenerate"
    parameters:
      aspectRatio:
        options:
          - { value: "16:9", label: "16:9" }
          - { value: "9:16", label: "9:16" }
          - { value: "1:1", label: "1:1" }
        defaultValue: "16:9"
      duration:
        options:
          - { value: 4, label: "4s" }
          - { value: 6, label: "6s" }
          - { value: 8, label: "8s" }
        defaultValue: 4
        unit: "s"
      resolution:
        options:
          - { value: "720P", label: "720P" }
          - { value: "1080P", label: "1080P" }
        defaultValue: "720P"
    research:
      status: "verified"
      docUrl: "docs/evidence/2026-08-14-omnimux-video.md"
      verifiedAt: "2026-08-14"
