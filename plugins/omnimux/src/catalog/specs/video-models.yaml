# 视频模型能力契约 (Video Models Capability Contract)
version: "1.0"
modality: "video"

models:
  # 字节跳动 Seedance 系列：支持文生、首帧、多图参考，绝不支持首尾帧过渡
  - id: "seedance-2-0-fast"
    label: "Seedance 2.0 Fast"
    family: "bytedance"
    badge: "默认"
    subtitle: "720P · ⏱ 4-8s"
    modes:
      - mode: "text_to_video"
        label: "文生视频"
        inputs: []
      - mode: "first_frame"
        label: "首帧生视频"
        inputs:
          - slot: "start_frame"
            type: "image"
            role: "first_frame"
            min: 1
            max: 1
            allowedMimes: ["image/png", "image/jpeg", "image/webp"]
            maxSizeMb: 20
      - mode: "video_multi_ref"
        label: "多图参考"
        inputs:
          - slot: "reference_images"
            type: "image"
            role: "reference"
            min: 1
            max: 4
            allowedMimes: ["image/png", "image/jpeg", "image/webp"]
            maxSizeMb: 20
    parameters:
      aspectRatio: ["16:9", "9:16", "1:1"]
      duration: [4, 6, 8]
      resolution: ["720P", "1080P"]
    governance:
      docUrl: "https://www.volcengine.com/docs/82379/1344485"
      confidence: "verified"

  - id: "seedance-2-5"
    label: "Seedance 2.5"
    family: "bytedance"
    badge: "即梦旗舰"
    subtitle: "720P-1080P · ⏱ 5-10s"
    modes:
      - mode: "text_to_video"
        label: "文生视频"
