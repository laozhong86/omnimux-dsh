# 视频模型能力契约 (Video Models Capability Contract)
# H1: 全部 op research=draft + execution=stub|none → listedOperations=[]
# 禁止 verified+live；Kling Avatar 不 listed；不审计 runtime limits（H2）
schemaVersion: "1.1"
managementGroup: "video"
modality: "video"

models:
  # 字节跳动 Seedance 系列：支持文生、首帧、多图参考，绝不支持首尾帧过渡
  - id: "seedance-2-0-fast"
    label: "Seedance 2.0 Fast"
    family: "bytedance"
    badge: "默认"
    subtitle: "720P · ⏱ 4-8s"
    operations:
      - id: "text_to_video"
        label: "文生视频"
        output:
          type: "video"
        inputs:
          - slot: "prompt"
            type: "text"
            role: "prompt"
            source: "node_field"
            min: 1
            max: 1
      - id: "first_frame"
        label: "首帧生视频"
        output:
          type: "video"
        inputs:
          - slot: "prompt"
            type: "text"
            role: "prompt"
            source: "node_field"
            min: 1
            max: 1
          - slot: "start_frame"
            type: "image"
            role: "first_frame"
            source: "upstream_edge"
            min: 1
            max: 1
            allowedMimes: ["image/png", "image/jpeg", "image/webp"]
            maxSizeMb: 20
            limitSource:
              kind: "official_docs"
              url: "https://www.volcengine.com/docs/82379/1344485"
      - id: "video_multi_ref"
        label: "多图参考"
        output:
          type: "video"
        inputs:
          - slot: "prompt"
            type: "text"
            role: "prompt"
            source: "node_field"
            min: 1
            max: 1
          - slot: "reference_images"
            type: "image"
            role: "reference"
            source: "upstream_edge"
            min: 1
            max: 4
            allowedMimes: ["image/png", "image/jpeg", "image/webp"]
            maxSizeMb: 20
            limitSource:
              kind: "official_docs"
              url: "https://www.volcengine.com/docs/82379/1344485"
    parameters:
      aspectRatio: ["16:9", "9:16", "1:1"]
      duration: [4, 6, 8]
      resolution: ["720P", "1080P"]
    research:
      status: "draft"
      notes: "H1 zero listed claim; H2 re-audit strong live path"
      docUrl: "https://www.volcengine.com/docs/82379/1344485"
    execution:
      status: "stub"
      profileId: "videoGenerate"
      seam: "videoGenerate"

