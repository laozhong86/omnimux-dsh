# 文本模型能力契约 (Text Models Capability Contract)
version: "1.0"
modality: "text"

models:
  - id: "deepseek-v3"
    label: "DeepSeek V3"
    family: "deepseek"
    modes:
      - mode: "chat"
        label: "文本对话"
        inputs: []

  - id: "deepseek-r1"
    label: "DeepSeek R1"
    family: "deepseek"
    badge: "深度推理"
    modes:
      - mode: "chat"
        label: "推理对话"
        inputs: []

  - id: "gpt-4o"
    label: "GPT 4o"
    family: "openai"
    modes:
      - mode: "chat"
        label: "通用对话"
        inputs: []
      - mode: "vision_chat"
        label: "多模态视觉理解"
        inputs:
          - slot: "reference_images"
            type: "image"
            role: "reference"
            min: 1
            max: 10
            allowedMimes: ["image/png", "image/jpeg", "image/webp"]
            maxSizeMb: 20
