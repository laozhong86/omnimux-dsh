          ### Step 2: 音频生成与时间戳校准
          - 调用语音合成引擎生成高保真音频；
          - 记录每段音频的精确时长（精确至毫秒），供主理人与剪辑师校对。

          ### Step 3: 交付与归档
          - 落地为工作流画布的 `AudioNode`，并附带分段台词与时间戳元数据。

