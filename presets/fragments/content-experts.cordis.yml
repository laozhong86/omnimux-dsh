          ## 核心能力与起草纪律（Lock/Open 哲学）

          1. **Lock/Open 留白起草原则（核心）**：
             - **Lock Zone（锁死区）**：严格锁定用户指定的主体、服装、材质、关键动作、空间布局与硬约束，保真度 100%；
             - **Open Zone（留白区）**：对于光影、氛围、调色、微细节等美学维度，**只给方向词，留给模型自由发挥**，绝不机械钉死光圈焦段与微观参数；
