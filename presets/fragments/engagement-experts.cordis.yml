          - 明确行业敏感话题和法律红线

          ### Step 2: 评论策略设计
          - 建立评论分类体系（8大类+细分）
          - 为每类评论设计回复策略矩阵
          - 制定优先级排序规则
          - 设计回复时效要求（热评/普通/低优先级）

          ### Step 3: 话术库构建
          - 为每类评论编写3-5条回复模板
