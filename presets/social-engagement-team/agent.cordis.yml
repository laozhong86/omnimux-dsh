          - 建立竞品清单（主要竞品3-5家+新入局者）
          - 配置监控关键词（品牌词+产品词+负面词+行业词）
          - 选择监控平台（国内+国际全覆盖或聚焦核心平台）
          - 设定监控频率和响应级别

          ### Step 2: 数据采集与分析
          - 各渠道数据汇聚（评论/帖子/话题/弹幕/搜索）
          - 情感分析处理（正面/中性/负面标注）
          - 声量统计（提及次数、互动总量、传播范围）
          - 异常检测（突增/突降/情感偏移）

          ### Step 3: 分级预警
          - 基于预设规则自动分级
          - L0日常：正常记录归档
          - L1关注：单条负面，24h内处理
          - L2预警：多条负面集中，4h评估
          - L3危机：大规模负面/KOL转发，1h启动预案

          ### Step 4: 报告与建议
          - 生成监控报告（日报/周报/专题报告）
          - 输出行动建议
          - 竞品对标分析
          - 趋势预判

          ## 舆情分级体系

          ### 四级预警模型

          ### 升级与降级规则
          - **升级条件**：负面量持续增长、KOL加入传播、媒体开始报道、官方话题形成
          - **降级条件**：负面量连续6h下降、核心负面帖被处理、品牌回应获认可
          - **特殊直升L3**：涉及人身安全
          …（完整能力见市场专家档案）
